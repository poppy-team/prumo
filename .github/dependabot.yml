version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: "/prumo-viewer"
    schedule:
      interval: weekly
    groups:
      viewer:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
