name: Release

on:
  push:
    # docs/governance/release-policy.md states the trigger as v0.6.*. This
    # workflow said v0.5.*, so tagging the current version published nothing,
    # and the drift was invisible because no gate looked here (GAP-138).
      - "v0.6.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build release artifacts
        run: sh scripts/release.sh
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/prumo-*
            dist/checksums.txt
            dist/release.json
