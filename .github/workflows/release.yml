name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies for Agent IDE
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libgl1-mesa-dev libx11-dev libx11-xcb-dev libxkbcommon-dev
      - name: Build release artifacts
        run: VERSION="${GITHUB_REF_NAME#v}" sh scripts/release.sh
      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/prumo-*
            dist/checksums.txt
            dist/release.json
