name: CI

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go format check
        run: |
          diff -u <(echo -n) <(gofmt -d .)
      - name: Go vet
        run: go vet ./...
      # The module now has external dependencies (the TUI stack), so the
      # checksums are a gate rather than a formality: a served module whose
      # hash does not match go.sum fails here instead of at runtime.
      - name: Module checksum verification
        run: go mod verify
      - name: Go test
        run: go test -v -race ./...
      - name: Build Prumo CLI
        run: go build -o /tmp/prumo ./cmd/prumo
      - name: Documentation authority gate
        run: /tmp/prumo docs authority --path . --json
      - name: Agent surface context-rot gate
        run: /tmp/prumo docs agents verify --path . --json
      - name: Documentation verification gate
        run: /tmp/prumo docs verify --path . --json
      - name: Documentation strict readiness gate
        run: /tmp/prumo docs verify --path . --strict --json
      - name: Terminology gate
        run: /tmp/prumo docs glossary --path . --json
      - name: Documentation version policy gate
        run: /tmp/prumo docs version --path . --json
      - name: Documentation gauntlet (deterministic rounds)
        run: /tmp/prumo docs gauntlet --path . --json
      - name: CLI smoke test
        run: |
          rm -rf /tmp/prumo-smoke
          /tmp/prumo init /tmp/prumo-smoke --profile examples/brasa/project-profile.json --non-interactive
          /tmp/prumo validate /tmp/prumo-smoke
          /tmp/prumo context plan "add a transition template" --path /tmp/prumo-smoke --json
          /tmp/prumo goal new P00-G01 "Foundation" --phase P00 --path /tmp/prumo-smoke
          /tmp/prumo goal list --path /tmp/prumo-smoke
          /tmp/prumo compile --target codex --path /tmp/prumo-smoke
          /tmp/prumo compile --target traycer --path /tmp/prumo-smoke
          /tmp/prumo compile --target opencode --path /tmp/prumo-smoke
          /tmp/prumo connector list
          /tmp/prumo framework-check
          test ! -e /tmp/prumo-smoke/PROJECT_MANIFEST.yaml
          test ! -e /tmp/prumo-smoke/.prumo/project-profile.yaml
