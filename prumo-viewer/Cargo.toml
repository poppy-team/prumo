[package]
name = "prumo-viewer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "prumo-native"
path = "src/main.rs"

[dependencies]
freya = { version = "0.4.3", features = ["code-editor", "icons-lucide"] }
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-toml-ng = "0.7"
torin = "0.4.3"
async-io = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.7"
portable-pty = "0.9"
vt100 = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
freya-testing = "0.4.3"
tempfile = "3"
