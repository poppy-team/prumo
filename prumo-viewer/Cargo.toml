[package]
name = "prumo-viewer"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
description = "Prumo Native Workspace Viewer: Agent-Aware Lightweight Workspace Viewer & Editor"
license = "MIT"

[[bin]]
name = "prumo-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.35"
egui_extras = { version = "0.35", default-features = false, features = ["syntect"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
notify = "8"
similar = { version = "2.7", features = ["inline"] }
nucleo-matcher = "0.3"
portable-pty = "0.9"
vt100 = "0.16"
rfd = "0.17"
arboard = "3.6"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
pulldown-cmark = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
git2 = { version = "0.21", features = ["vendored-libgit2"] }
walkdir = "2"
glob = "0.3"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
insta = "1"
proptest = "1"
tempfile = "3"
