[package]
name = "prumo-extension-sdk"
version = "0.1.0"
edition = "2024"
description = "Stable SDK contracts for Prumo Viewer extensions"
license = "MIT"
repository = "https://github.com/raillen/prumo"
documentation = "https://github.com/raillen/prumo/tree/main/prumo-viewer/extension-sdk"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2.2"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2.2"
