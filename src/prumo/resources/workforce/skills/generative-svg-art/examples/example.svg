<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" role="img" aria-labelledby="gen-title gen-desc">
  <title id="gen-title">Algorithmic Topographic Flow Field</title>
  <desc id="gen-desc">Procedurally generated multi-octave flow curves with cyan-to-indigo gradient and subtle Perlin noise displacement.</desc>
  <defs>
    <linearGradient id="stream-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="stream-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>
    <filter id="topographic-noise" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="808" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" result="displaced" />
    </filter>
  </defs>

  <!-- Deep space canvas backdrop -->
  <rect width="800" height="600" fill="#090d16" />

  <!-- Flow ribbons layer 1 -->
  <g filter="url(#topographic-noise)" opacity="0.85">
    <path d="M-50,150 C120,80 250,220 400,160 C550,100 680,240 850,180
             M-50,200 C130,130 260,270 410,210 C560,150 690,290 850,230
             M-50,250 C140,180 270,320 420,260 C570,200 700,340 850,280
             M-50,300 C150,230 280,370 430,310 C580,250 710,390 850,330
             M-50,350 C160,280 290,420 440,360 C590,300 720,440 850,380"
          fill="none" stroke="url(#stream-grad-1)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Flow ribbons layer 2: Counter harmonic -->
  <g opacity="0.6">
    <path d="M-50,380 C180,450 320,310 480,390 C620,470 730,350 850,420
             M-50,430 C190,500 330,360 490,440 C630,520 740,400 850,470
             M-50,480 C200,550 340,410 500,490 C640,570 750,450 850,520"
          fill="none" stroke="url(#stream-grad-2)" stroke-width="1.8" stroke-dasharray="8 4" stroke-linecap="round" />
  </g>

  <!-- Accent anchor nodes -->
  <g fill="#38bdf8">
    <circle cx="400" cy="160" r="3.5" opacity="0.9" />
    <circle cx="410" cy="210" r="2.5" opacity="0.8" />
    <circle cx="480" cy="390" r="3" opacity="0.9" />
    <circle cx="490" cy="440" r="2" opacity="0.7" />
  </g>
</svg>
