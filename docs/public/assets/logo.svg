<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="bobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bobFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle container background with precision blueprint stroke -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Blueprint precision coordinate grid lines -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="3 3" />
  <line x1="60" y1="18" x2="60" y2="102" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 2" />
  <circle cx="60" cy="60" r="34" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="2 4" />

  <!-- Plumb Line suspension ring & top anchor -->
  <circle cx="60" cy="24" r="5" fill="none" stroke="#93c5fd" stroke-width="2" />
  <line x1="60" y1="29" x2="60" y2="44" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />

  <!-- Precision Plumb Bob (Prumo de Precisão) Body -->
  <!-- Upper hexagonal cylindrical collar -->
  <polygon points="46,44 74,44 71,51 49,51" fill="#1e40af" stroke="#60a5fa" stroke-width="1.2" />

  <!-- Main faceted geometric plumb bob body -->
  <!-- Left facet -->
  <polygon points="48,51 60,51 60,86 42,66" fill="url(#bobGrad)" filter="url(#glow)" />
  <!-- Right facet (highlighted with vibrant cyan/blue) -->
  <polygon points="60,51 72,51 78,66 60,86" fill="url(#bobFacet)" />
  <!-- Center spine line -->
  <line x1="60" y1="51" x2="60" y2="86" stroke="#bfdbfe" stroke-width="1.2" stroke-linecap="round" />

  <!-- Plumb needle tip pointing to ground truth -->
  <polygon points="57,86 63,86 60,95" fill="#38bdf8" filter="url(#glow)" />

  <!-- Ground truth target point / Git commit node -->
  <circle cx="60" cy="98" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="60" cy="98" r="6" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />

  <!-- Corner engineering marks -->
  <path d="M18 28 V18 H28" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path d="M92 18 H102 V28" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path d="M18 92 V102 H28" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  <path d="M102 92 V102 H92" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
</svg>
